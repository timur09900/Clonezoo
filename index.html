<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clone Zoo</title>
<!-- External fonts are intentionally optional: the game must start even when offline or embedded in Acode. -->
<style>
:root{
  --bg:#020104;
  --bg-deep:#010002;
  --vio-dark:#120822;
  --vio-mid:#28134a;
  --vio-bright:#4d268c;
  --vio-glow:#6d3bc2;
  --vio-soft:#cbb8f0;
  --ink:#efeaf8;
  --mut:#7d7196;
  --acc:#3c1d70;
  --acc2:#5a2ea6;
  --gold:#b79ce8;
  --line:rgba(135,96,210,.15);
  --line-bright:rgba(175,142,240,.28);
  --glass-bg:linear-gradient(155deg,rgba(22,12,42,.72) 0%,rgba(6,3,13,.88) 55%,rgba(14,7,28,.82) 100%);
  --glass-shadow:
    0 14px 32px -12px rgba(0,0,0,.95),
    inset 0 1px 1px rgba(205,180,255,.18),
    inset 0 -1.5px 2px rgba(0,0,0,.8);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:border-box}

html,body{
  width:100%;min-width:0;max-width:none;
  height:100%;height:100dvh;min-height:100%;
  margin:0;overflow:hidden;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:
    radial-gradient(90% 55% at 15% -5%,rgba(42,18,82,.26) 0%,transparent 60%),
    radial-gradient(85% 50% at 88% 105%,rgba(34,14,68,.22) 0%,transparent 58%),
    #020104;
  color:var(--ink);
  font:15px/1.38 'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  display:flex;
  flex-direction:column;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
  letter-spacing:.12px;
}

/* Lightweight static dark-violet background (zero GPU blur/morph overhead) */
#bg{
  position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(55vmax 55vmax at 12% 14%,rgba(44,18,86,.22) 0%,transparent 68%),
    radial-gradient(50vmax 50vmax at 86% 78%,rgba(34,13,68,.18) 0%,transparent 70%),
    #020104;
}
#bg i{display:none}

/* Top Liquid Glass Capsule Header */
#top{
  flex:0 0 auto;
  width:calc(100% - clamp(16px,3vw,36px));
  margin:10px auto 4px;
  padding:11px 18px;
  display:flex;justify-content:space-between;align-items:center;
  border-radius:28px;
  background:var(--glass-bg);
  border:1px solid var(--line-bright);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:var(--glass-shadow);
  position:relative;
  overflow:hidden;
}
#top::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(125deg,rgba(195,168,255,.1) 0%,transparent 42%,transparent 75%,rgba(110,62,195,.07) 100%);
}
#coins{
  font-family:'Unbounded','Nunito',sans-serif;
  font-size:clamp(24px,3.6vw,34px);
  font-weight:800;
  background:linear-gradient(180deg,#f2ecff 0%,#b89ee8 55%,#6e49b3 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  display:inline-block;
  filter:drop-shadow(0 2px 10px rgba(96,52,175,.32));
}
.bp{animation:bp .26s cubic-bezier(.2,1.6,.4,1)}@keyframes bp{45%{transform:scale(1.13)}}
.mut{color:var(--mut);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800}
.pill{
  background:linear-gradient(160deg,rgba(165,132,235,.14),rgba(10,5,22,.82));
  border:1px solid var(--line-bright);
  border-radius:999px;
  padding:6px 14px;
  font-weight:800;font-size:13px;color:#ebe3fa;
  box-shadow:inset 0 1px 1px rgba(205,182,255,.22),inset 0 -1.5px 2px rgba(0,0,0,.75),0 6px 16px -6px rgba(0,0,0,.92);
}

/* Main Scrollable Area */
#list{
  flex:1 1 auto;min-height:0;width:100%;
  overflow-y:auto;
  padding:10px clamp(12px,2.4vw,30px) 16px;
  -webkit-overflow-scrolling:touch;
}
#list::-webkit-scrollbar{width:4px}
#list::-webkit-scrollbar-thumb{background:linear-gradient(var(--vio-mid),var(--vio-glow));border-radius:99px}

/* Floating Bottom Dock */
#nav{
  flex:0 0 auto;
  width:calc(100% - clamp(16px,3vw,36px));
  margin:4px auto calc(env(safe-area-inset-bottom,0px) + 10px);
  padding:5px;
  display:grid;grid-template-columns:repeat(6,1fr);gap:4px;
  border-radius:30px;
  background:linear-gradient(165deg,rgba(18,9,36,.88),rgba(5,2,11,.96));
  border:1px solid var(--line-bright);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:
    0 16px 36px -10px rgba(0,0,0,.98),
    inset 0 1px 1px rgba(195,168,255,.2),
    inset 0 -1.5px 2px rgba(0,0,0,.85);
}
#nav button{
  position:relative;border:1px solid transparent;background:none;
  color:var(--mut);padding:7px 2px 6px;
  font:800 9.5px 'Nunito',sans-serif;
  border-radius:24px;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;
}
#nav button span{display:block;font-size:20px;line-height:1.25;filter:grayscale(.35) brightness(.9);transition:transform .22s,filter .22s}
#nav button.on{
  color:#fff;
  border-color:rgba(175,142,240,.32);
  background:linear-gradient(165deg,rgba(82,42,150,.48) 0%,rgba(28,12,56,.68) 100%);
  box-shadow:
    0 6px 18px -6px rgba(82,42,150,.45),
    inset 0 1px 1px rgba(210,188,255,.28),
    inset 0 -1.5px 2px rgba(6,2,14,.75);
}
#nav button.on span{filter:drop-shadow(0 2px 8px rgba(145,98,230,.5));animation:nv .38s cubic-bezier(.2,1.8,.4,1)}
@keyframes nv{from{transform:translateY(5px) scale(.65)}}

#list.anim>*{animation:in .35s cubic-bezier(.2,1.2,.4,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px) scale(.98)}}

/* Dark Glass Cards with Specular Rim (no heavy per-card backdrop-filter) */
.card{
  position:relative;
  background:var(--glass-bg);
  border:1px solid var(--line);
  border-radius:26px;
  padding:15px 16px;
  margin-bottom:12px;
  box-shadow:var(--glass-shadow);
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:7%;right:7%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(195,168,255,.28),transparent);
  pointer-events:none;
}
.h{
  font-weight:900;margin:14px 4px 10px;
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:'Unbounded','Nunito',sans-serif;font-size:15px;letter-spacing:.02em;
  color:#e8e0f7;
}
.pet{
  display:flex;gap:12px;align-items:center;
  border-color:color-mix(in srgb,var(--rc,var(--vio-bright)) 44%,rgba(165,132,235,.15));
  box-shadow:var(--glass-shadow);
}
.ic{
  width:56px;height:56px;border-radius:20px;
  background:linear-gradient(155deg,color-mix(in srgb,var(--rc,#4d268c) 26%,rgba(255,255,255,.06)),rgba(7,3,15,.88));
  border:1px solid color-mix(in srgb,var(--rc,var(--line-bright)) 52%,transparent);
  display:flex;align-items:center;justify-content:center;font-size:32px;flex:none;
  box-shadow:inset 0 1px 1px rgba(205,182,255,.22),inset 0 -2px 4px rgba(0,0,0,.78),0 6px 14px -6px rgba(0,0,0,.9);
}
.tx{flex:1;min-width:0}.tx b{display:block}
.rk{font-size:10px;font-weight:800;color:#080410;background:var(--rc);padding:2px 8px;border-radius:999px;letter-spacing:.08em}

/* Dark-Violet Glass Pill Buttons */
.b{
  position:relative;overflow:hidden;
  border:1px solid rgba(175,142,240,.34);
  border-radius:18px;padding:10px 14px;
  background:linear-gradient(160deg,rgba(88,46,162,.72) 0%,rgba(40,18,80,.88) 55%,rgba(18,7,38,.96) 100%);
  color:#f5f0ff;font:800 13px 'Nunito',sans-serif;white-space:nowrap;
  box-shadow:
    0 8px 20px -8px rgba(72,34,140,.55),
    inset 0 1px 1px rgba(215,195,255,.32),
    inset 0 -2px 3px rgba(5,2,12,.8);
  transition:transform .09s,filter .18s;
  cursor:pointer;
}
.b:hover{filter:brightness(1.12)}
.b:active{transform:scale(.94)}
.b.g{background:linear-gradient(160deg,rgba(104,56,188,.78) 0%,rgba(44,20,88,.92) 100%)}
.b.s{
  background:linear-gradient(160deg,rgba(165,132,235,.1),rgba(10,5,22,.82));
  color:var(--ink);border:1px solid var(--line-bright);
  box-shadow:inset 0 1px 1px rgba(200,175,255,.18),inset 0 -1.5px 2px rgba(0,0,0,.75),0 6px 14px -8px #000;
}
.b.on{outline:2px solid var(--vio-glow);outline-offset:1px}
.b.no{opacity:.36;filter:saturate(.35)}
.b.w{width:100%;padding:14px;font-size:15px;border-radius:20px}

.r2{display:flex;gap:8px}.r2 .b{flex:1}.chips{display:flex;gap:6px}.chips .b{flex:1}
.chip{
  display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;
  border-radius:999px;border:1px solid currentColor;margin:3px 3px 0 0;
  letter-spacing:.05em;background:rgba(5,2,12,.72);
}
.bar{
  position:relative;height:22px;border-radius:999px;
  background:rgba(3,1,8,.84);overflow:hidden;margin-top:6px;
  border:1px solid var(--line-bright);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.85);
}
.bar i{
  position:absolute;left:0;top:0;bottom:0;
  background:linear-gradient(90deg,#331663,#5b2da8,#8652de);
  border-radius:999px;
  box-shadow:0 0 10px rgba(109,59,194,.45),inset 0 1px 1px rgba(215,195,255,.35);
}
.bar b{position:absolute;inset:0;text-align:center;font-size:11px;line-height:22px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000c;letter-spacing:.05em}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{flex:1;height:5px;border-radius:99px;background:rgba(165,132,235,.1)}
.pips i.f{background:linear-gradient(90deg,#3c1d70,#7442c9);box-shadow:0 0 6px rgba(109,59,194,.4)}

/* Pet & Team Tiles */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tl{
  position:relative;
  border:1px solid color-mix(in srgb,var(--rc,var(--vio-bright)) 50%,rgba(165,132,235,.18));
  border-radius:22px;padding:9px 3px 6px;text-align:center;
  background:linear-gradient(155deg,rgba(24,13,46,.76),rgba(6,3,13,.9));
  box-shadow:0 8px 18px -10px #000,inset 0 1px 1px rgba(200,175,255,.2),inset 0 -1.5px 2px rgba(0,0,0,.78);
  transition:transform .12s,border-color .18s;cursor:pointer;
}
.tl:hover{border-color:rgba(185,155,245,.45)}
.tl:active{transform:scale(.91)}
.tl i{font-style:normal;font-size:32px;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.75))}
.tl b{position:absolute;top:4px;right:6px;font-size:11px;background:rgba(6,3,13,.92);color:#ebe3fa;border:1px solid var(--line-bright);border-radius:999px;padding:0 6px}
.tl small{display:block;font-size:9px;color:var(--tc,var(--mut));font-weight:800;letter-spacing:.04em}
.tl.can{box-shadow:0 0 22px -4px var(--rc),inset 0 1px 1px rgba(215,195,255,.3)}
.tl.empty{border-style:dashed;border-color:rgba(145,108,215,.2);opacity:.48;box-shadow:inset 0 1px 0 rgba(185,155,245,.08)}

.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed rgba(155,120,220,.14)}.stat:last-child{border:0}.stat span{color:var(--mut);font-size:12px;font-weight:700}
.hint{color:var(--mut);text-align:center;font-size:13px;padding:10px}
input,select{
  width:100%;box-sizing:border-box;padding:12px 14px;
  border:1px solid var(--line-bright);border-radius:18px;
  background:rgba(5,2,12,.84);color:var(--ink);
  font:16px 'Nunito',sans-serif;margin-bottom:8px;
  user-select:text;-webkit-user-select:text;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.8),0 1px 0 rgba(185,155,245,.1);
}
.me{outline:2px solid var(--gold)}

/* Central Dark-Violet Glass Orb Tap Button */
.tapwrap{position:relative;height:310px;display:flex;justify-content:center;align-items:center}
.tapwrap::before{
  content:'';position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(78,38,148,.34) 0%,rgba(28,12,56,.18) 52%,transparent 72%);
  pointer-events:none;
}
#tapb{
  position:relative;z-index:1;width:216px;height:216px;border-radius:50%;
  border:1.5px solid rgba(185,155,245,.38);
  font-size:102px;
  background:
    radial-gradient(circle at 29% 21%,rgba(215,195,255,.36) 0%,rgba(145,108,215,.12) 28%,transparent 52%),
    radial-gradient(circle at 72% 82%,rgba(92,48,172,.38) 0%,transparent 55%),
    linear-gradient(155deg,rgba(68,34,132,.86) 0%,rgba(24,10,48,.94) 62%,rgba(8,3,18,.98) 100%);
  box-shadow:
    0 20px 44px -10px rgba(56,24,114,.65),
    0 0 30px -8px rgba(96,52,175,.38),
    inset 0 3px 4px rgba(215,195,255,.42),
    inset 0 -15px 30px rgba(4,1,10,.92);
  transition:transform .07s cubic-bezier(.2,1.6,.4,1);
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.85));
  cursor:pointer;
}
#tapb:active{transform:scale(.91)}
#tapb::after{
  content:'';position:absolute;inset:-6px;border-radius:50%;
  border:1.5px solid rgba(145,105,220,.32);
  pointer-events:none;
}

.orbit{position:absolute;inset:0;animation:spin 28s linear infinite;pointer-events:none;z-index:2;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit span{position:absolute;left:50%;top:50%;margin:-16px 0 0 -16px;width:32px;height:32px;transform:rotate(var(--a)) translateY(-140px) rotate(calc(var(--a) * -1))}
.orbit i{display:block;font-size:26px;font-style:normal;line-height:32px;text-align:center;animation:spinr 28s linear infinite;filter:drop-shadow(0 3px 8px rgba(0,0,0,.9))}
@keyframes spinr{to{transform:rotate(-360deg)}}

.fl2{position:fixed;pointer-events:none;font-weight:900;font-size:22px;z-index:5;animation:up .9s ease-out forwards;text-shadow:0 0 10px rgba(109,59,194,.85)}.fl2.c{font-size:32px;color:#dfd2fa}
@keyframes up{to{transform:translateY(-100px);opacity:0}}
.pt{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:25;animation:pt .65s ease-out forwards}@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.gold{position:fixed;font-size:64px;z-index:6;animation:gl 1.2s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(165,132,235,.72))}@keyframes gl{50%{transform:scale(1.25) rotate(12deg)}}

/* Dark-Violet Modals & Overlays */
.rv{
  position:fixed;inset:0;z-index:20;
  background:radial-gradient(circle at 50% 40%,rgba(22,10,44,.86),rgba(1,0,3,.97));
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:16px;overflow:auto;
}
.rw{
  position:relative;width:min(92vw,520px);height:112px;overflow:hidden;
  border-radius:24px;border:1px solid var(--line-bright);
  background:rgba(5,2,12,.9);flex:none;
  box-shadow:0 18px 42px -12px #000,inset 0 1px 1px rgba(195,168,255,.22);
}
.rs{display:flex;height:100%;transition:transform 3.4s cubic-bezier(.12,.7,.1,1)}
.rt{flex:none;width:92px;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;border-right:1px solid rgba(165,132,235,.08);background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--rc) 38%,transparent))}
.mk{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#dfd2fa;box-shadow:0 0 12px #8a5ce0}
.res{text-align:center;color:#fff;animation:pp .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pp{from{opacity:0;transform:scale(.3)}}
.res .big{font-size:110px;filter:drop-shadow(0 0 26px var(--rc))}.res b{font-size:24px;display:block}
.sc{
  position:relative;
  background:linear-gradient(155deg,rgba(26,14,50,.92) 0%,rgba(6,3,13,.97) 100%);
  border:1px solid color-mix(in srgb,var(--rc,var(--vio-glow)) 50%,rgba(185,155,245,.28));
  border-radius:30px;padding:20px;width:min(92vw,390px);text-align:center;
  animation:pp .3s;
  box-shadow:0 24px 56px -14px #000,inset 0 1px 1px rgba(205,182,255,.28),inset 0 -2px 4px rgba(0,0,0,.85);
}
.sc .big{font-size:84px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.78))}
.tierb{display:inline-block;color:#080410;font-weight:900;border-radius:999px;padding:3px 12px;margin:6px 0 10px}
.res .grid{width:min(92vw,520px)}

#toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);
  transform:translate(-50%,-100px);
  background:linear-gradient(155deg,rgba(30,16,58,.94),rgba(7,3,15,.98));
  border:1px solid rgba(185,155,245,.34);
  color:#f0ebfa;padding:10px 20px;border-radius:999px;
  font-weight:800;font-size:13.5px;transition:transform .32s cubic-bezier(.2,1.3,.4,1);z-index:50;
  max-width:90%;text-align:center;
  box-shadow:0 14px 32px -8px #000,inset 0 1px 1px rgba(210,188,255,.28);
}
#toast.on{transform:translate(-50%,0)}

#adm{
  display:none;position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:580px;z-index:30;
  background:linear-gradient(175deg,rgba(20,10,40,.97),rgba(4,2,9,.99));
  border-top:1px solid var(--line-bright);border-radius:30px 30px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:80%;overflow:auto;
  box-shadow:0 -20px 52px -10px #000,inset 0 1px 1px rgba(195,168,255,.24);
}
#adm.on{display:block}#adm h3{margin:0 0 8px;font-size:15px}
#adm summary{font-weight:800;padding:8px 0;border-bottom:1px solid var(--line)}
#adm .r{display:flex;gap:6px;margin:6px 0}
#adm button,#adm input,#adm select{flex:1;min-width:0;margin:0;padding:10px 6px;border:1px solid var(--line-bright);border-radius:16px;background:rgba(165,132,235,.08);color:var(--ink);font:700 13px 'Nunito',sans-serif}
#adm input,#adm select{font-size:16px;padding:10px}

@media(min-width:760px){
  #list{padding:12px clamp(16px,2.5vw,32px) 18px}
  .card{padding:18px 20px}
  .h{font-size:17px}
  .tl i{font-size:38px}
  #coins{font-size:36px}
}

/* Case Preview Modal in Deep Dark-Violet Glass */
.casepeek{
  position:fixed;inset:0;z-index:9998;
  display:flex;align-items:center;justify-content:center;
  box-sizing:border-box;padding:clamp(8px,2.5vw,28px);
  background:radial-gradient(circle at 50% 45%,rgba(22,10,44,.88),rgba(1,0,3,.97));
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
}
.casepanel{
  box-sizing:border-box;position:relative;
  width:min(1180px,calc(100vw - 2 * clamp(8px,2.5vw,28px)));
  max-width:1180px;max-height:min(90dvh,900px);
  overflow:auto;overscroll-behavior:contain;
  margin:auto;padding:clamp(14px,1.8vw,22px);
  border-radius:30px;
  border:1px solid var(--line-bright);
  background:linear-gradient(155deg,rgba(24,13,46,.92) 0%,rgba(6,3,13,.96) 58%,rgba(3,1,7,.99) 100%);
  box-shadow:0 28px 90px #000e,inset 0 1px 1px rgba(195,168,255,.26);
}
.casehero{
  display:flex;align-items:center;gap:14px;min-width:0;
  padding:12px 14px;border-radius:22px;
  border:1px solid var(--line-bright);
  background:linear-gradient(145deg,rgba(46,24,88,.62),rgba(9,4,19,.88));
  box-shadow:inset 0 1px 1px rgba(195,168,255,.2);
}
.casehero>div:last-child{min-width:0}
.caseemoji{font-size:48px;filter:drop-shadow(0 0 14px rgba(130,84,218,.5))}
.caseitems{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:10px 0}
.caseitem{
  background:linear-gradient(155deg,rgba(20,11,38,.82),rgba(5,2,12,.94));
  border:1px solid var(--line);border-radius:18px;
  min-width:0;min-height:88px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:9px 5px;text-align:center;overflow-wrap:anywhere;
  box-shadow:inset 0 1px 1px rgba(195,168,255,.16),0 6px 14px -8px #000;
}
.caseitem .ciemoji{font-size:clamp(24px,3vw,32px);line-height:1.1}

function startLeaderboardListener(){
  if(LB_UNSUB){LB_UNSUB();LB_UNSUB=null;}
  LB=[];
  LB_ERROR="";
  if(!DB||!CURRENT_USER)return;
  // Firestore listener starts only after Google authentication, otherwise rules
  // requiring request.auth reject the query and the UI silently falls back to self.
  LB_UNSUB=DB.collection("lb").orderBy("score","desc").limit(100).onSnapshot(s=>{
    LB=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    LB_ERROR="";
    if(tab===6&&PT===0&&document.activeElement.tagName!=="INPUT")render();
  },e=>{
    console.warn("Leaderboard read failed:",e);
    LB_ERROR=e&&e.code==="permission-denied"?"Firestore запрещает чтение коллекции lb (permission-denied)":"не удалось прочитать коллекцию lb";
    LB=[];
    if(tab===6&&PT===0)render();
  });
}
function scheduleCloudSave(){
  if(!AUTH||!CURRENT_USER||!DB)return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(async()=>{
    try{
      await DB.collection("saves").doc(CURRENT_USER.uid).set({
        state: JSON.parse(JSON.stringify(S)),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      },{merge:true});
    }catch(e){
      console.warn("Cloud save failed:",e);
      toast("Не удалось сохранить в облако. Проверь правила Firestore.");
    }
  },1200);
}
function updateAuthButton(){
  if(typeof window.refreshDeveloperAccess==="function")window.refreshDeveloperAccess();
  const b=$("authBtn");
  if(!b)return;
  if(CURRENT_USER){
    b.textContent="✓ "+(CURRENT_USER.displayName||CURRENT_USER.email||"Аккаунт");
    b.classList.add("signed");
    b.title="Вы вошли через Google";
  }else{
    b.textContent="Войти через Google";
    b.classList.remove("signed");
    b.title="Войти и включить облачное сохранение";
  }
}
async function finishGoogleLogin(user){
  if(!user)return;
  if(_syncedUid===user.uid){CURRENT_USER=user;UID=user.uid;updateAuthButton();startLeaderboardListener();push();return;}
  if(_syncingUid===user.uid)return;
  _syncingUid=user.uid;
  CURRENT_USER=user;
  UID=user.uid;
  updateAuthButton();
  startLeaderboardListener();
  try{
    const ref=DB.collection("saves").doc(user.uid);
    const snap=await ref.get();
    if(snap.exists&&snap.data()&&snap.data().state){
      S=Object.assign(def(),snap.data().state);
      SAFE_STORAGE.set("zoo3",JSON.stringify(S));
      toast("Облачное сохранение загружено");
      render();
      upd();
    }else{
      await ref.set({
        state:JSON.parse(JSON.stringify(S)),
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      },{merge:true});
      toast("Аккаунт подключён. Прогресс сохранён в облаке");
    }
    cloudReady=true;
    _syncedUid=user.uid;
    push();
    scheduleCloudSave();
  }catch(e){
    console.warn("Cloud account sync failed:",e);
    toast(e&&e.code==="permission-denied"?"Вход есть, но Firestore запрещает доступ. Нужны правила базы.":"Вход выполнен, но не удалось синхронизировать данные");
  }finally{_syncingUid="";}
}
$("authBtn").addEventListener("click",async()=>{
  if(!AUTH||!DB){toast("Firebase ещё не подключился. Проверь интернет.");return;}
  try{
    await AUTH.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  }catch(e){
    if(e&&["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code)){
      try{await AUTH.signInWithRedirect(new firebase.auth.GoogleAuthProvider())}
      catch(err){console.warn(err);toast("Не удалось открыть вход Google");}
    }else{
      console.warn("Google sign-in:",e);
      toast(e&&e.code==="auth/unauthorized-domain"?"Добавь домен сайта в Firebase Authorized domains":"Не удалось войти через Google");
    }
  }
});
(async()=>{
  try{
    if(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId){
      const loadScript=src=>new Promise((res,rej)=>{
        const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.append(s);
      });
      await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
      await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js");
      await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
      if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
      DB=firebase.firestore();
      AUTH=firebase.auth();
      AUTH.onAuthStateChanged(async user=>{
        if(user){await finishGoogleLogin(user);}
        else{
          CURRENT_USER=null;_syncedUid="";UID=getOrCreatePlayerId();
          if(LB_UNSUB){LB_UNSUB();LB_UNSUB=null;}
          LB=[];LB_ERROR="";updateAuthButton();
          if(tab===6)render();
        }
      });
      const redirect=await AUTH.getRedirectResult();
      if(redirect&&redirect.user)await finishGoogleLogin(redirect.user);
      else if(AUTH.currentUser)await finishGoogleLogin(AUTH.currentUser);
    }else if(window.claude){
      DB=await claude.use("db");
      const u=await claude.use("user");
      if(u){const cid=await u.id();if(cid)UID=cid;}
    }
  }catch(e){
    console.warn("Firebase initialization failed:",e);
    toast("Firebase не подключился. Проверь интернет и настройки проекта.");
  }
})();

 function commit(message,rerender=true){

 function creditCurrency(key,amount){
   amount=Math.min(MAX_GAME_NUM,Math.max(0,amount));
   if(key==="c"){S.c=Math.min(MAX_GAME_NUM,S.c+amount);S.all=Math.min(MAX_GAME_NUM,S.all+amount);S.run=Math.min(MAX_GAME_NUM,S.run+amount)}
   else S[key]=Math.min(MAX_GAME_NUM,(S[key]||0)+amount);
 }
 function multiplyCurrency(key,mult){
   const old=S[key]||0,next=Math.min(MAX_GAME_NUM,old*mult),delta=Math.max(0,next-old);
   S[key]=next;
   if(key==="c"){S.all=Math.min(MAX_GAME_NUM,S.all+delta);S.run=Math.min(MAX_GAME_NUM,S.run+delta)}
 }
